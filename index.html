<!DOCTYPE html>

<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调查问卷</title>

<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background: #f5f5f5;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
        color: #333;
        margin-bottom: 10px;
    }

    .status {
        color: #28a745;
        font-weight: bold;
        margin-bottom: 25px;
    }

    .question {
        margin-top: 25px;
    }

    .question-title {
        display: block;
        margin-bottom: 12px;
        color: #333;
        font-weight: bold;
        font-size: 16px;
    }

    .options {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .option {
        display: flex;
        align-items: center;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
    }

    .option:hover {
        background: #f5f8ff;
        border-color: #0969da;
    }

    .option input[type="radio"] {
        width: 18px;
        height: 18px;
        margin: 0 10px 0 0;
        cursor: pointer;
    }

    .option span {
        cursor: pointer;
    }

    button {
        width: 100%;
        margin-top: 25px;
        padding: 12px 30px;
        background: #0969da;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #0550ae;
    }

    button:disabled {
        background: #999;
        cursor: not-allowed;
    }

    .message {
        margin-top: 20px;
        padding: 10px;
        border-radius: 6px;
        display: none;
    }

    .success {
        display: block;
        background: #d4edda;
        color: #155724;
    }

    .error {
        display: block;
        background: #f8d7da;
        color: #721c24;
    }
</style>

</head>

<body>

<div class="card">

<h1>📋 调查问卷</h1>

<p class="status">请根据实际情况选择</p>

<form id="questionnaireForm">

    <!-- 评分 -->
    <div class="question">
        <label class="question-title">1. 请为本次体验评分</label>

        <div class="options">
            <label class="option">
                <input type="radio" name="rating" value="1" required>
                <span>1 分</span>
            </label>

            <label class="option">
                <input type="radio" name="rating" value="2">
                <span>2 分</span>
            </label>

            <label class="option">
                <input type="radio" name="rating" value="3">
                <span>3 分</span>
            </label>

            <label class="option">
                <input type="radio" name="rating" value="4">
                <span>4 分</span>
            </label>

            <label class="option">
                <input type="radio" name="rating" value="5">
                <span>5 分</span>
            </label>
        </div>
    </div>

    <!-- 性别 -->
    <div class="question">
        <label class="question-title">2. 您的性别</label>

        <div class="options">
            <label class="option">
                <input type="radio" name="gender" value="男" required>
                <span>男</span>
            </label>

            <label class="option">
                <input type="radio" name="gender" value="女">
                <span>女</span>
            </label>

            <label class="option">
                <input type="radio" name="gender" value="武装直升机">
                <span>武装直升机</span>
            </label>
        </div>
    </div>

    <button type="submit" id="submitButton">
        提交问卷
    </button>

</form>

<div id="message" class="message"></div>

</div>

<script>

const API_URL = "https://questionnaire-api-1.onrender.com/api/questionnaire";

const form = document.getElementById("questionnaireForm");
const button = document.getElementById("submitButton");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    button.disabled = true;
    button.textContent = "提交中...";

    message.className = "message";
    message.textContent = "";

    // 每次生成一个新的 UUID
    const deviceId = crypto.randomUUID();

    const data = {
        device_id: deviceId,
        rating: Number(
            document.querySelector('input[name="rating"]:checked').value
        ),
        gender:
            document.querySelector('input[name="gender"]:checked').value
    };

    try {

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {

            message.className = "message success";
            message.textContent = "✅ " + result.message;

            form.reset();

        } else {

            message.className = "message error";
            message.textContent =
                "❌ 提交失败：" +
                (result.detail || "未知错误");
        }

    } catch (error) {

        message.className = "message error";
        message.textContent =
            "❌ 无法连接到服务器，请稍后再试。";

        console.error(error);

    } finally {

        button.disabled = false;
        button.textContent = "提交问卷";
    }

});

</script>

</body>
</html>
